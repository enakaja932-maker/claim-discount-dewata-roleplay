<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claim Discount Dewata Roleplay</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay"></div>

  <div class="container">

    <img src="assets/logo.png" class="logo">

    <h1>DEWATA ROLEPLAY</h1>

    <p>
      Join Discord terlebih dahulu untuk mendapatkan hadiah discount eksklusif.
    </p>

    <button class="discord-btn" onclick="joinDiscord()">
      JOIN DISCORD
    </button>

    <button class="claim-btn" id="claimBtn" onclick="claimReward()">
      AMBIL HADIAH DISCOUNT
    </button>

    <div class="success" id="successText">
      🎉 Claim berhasil!
    </div>

    <div class="code-box" id="discountCode">
      DEWATA20
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

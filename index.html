<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Claim Discount Dewata Roleplay</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay"></div>

  <div class="container">

    <!-- LOGO -->
    <img
      src="assets/logo.png"
      class="logo"
      alt="Logo Dewata">

    <!-- TITLE -->
    <h1>DEWATA ROLEPLAY</h1>

    <!-- DESKRIPSI -->
    <p class="desc">
      Join Discord terlebih dahulu
      untuk mendapatkan hadiah
      discount eksklusif.
    </p>

    <!-- BUTTON LOGIN -->
    <button
      class="discord-btn"
      onclick="joinDiscord()">

      JOIN DISCORD

    </button>

    <!-- BUTTON CLAIM -->
    <button
      class="claim-btn"
      id="claimBtn"
      onclick="claimReward()">

      AMBIL HADIAH DISCOUNT

    </button>

    <!-- SUCCESS -->
    <div
      class="success"
      id="successText">

      🎉 Claim berhasil!

    </div>

    <!-- KODE DISCOUNT -->
    <div
      class="code-box"
      id="discountCode">

      LOADING...

    </div>

    <!-- INFO -->
    <div class="info-box">

      <small>
        1 akun Discord hanya bisa claim 1x
      </small>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
